<!doctype html>
<html lang="it">
<head>
  <!-- Pagina statica per GitHub Pages: nessuna build, nessuna dipendenza. -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>All in one</title>
  <meta name="description" content="All in one — sito statico ospitato su GitHub Pages.">
  <style>
    :root {
      --bg: #ffffff;
      --fg: #111827;
      --muted: #6b7280;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0b0f14;
        --fg: #e5e7eb;
        --muted: #9ca3af;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0b0f14;
      --fg: #e5e7eb;
      --muted: #9ca3af;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      padding: 16px;
      box-sizing: border-box;
    }
    main { text-align: center; max-width: 560px; }
    h1 { font-size: 2rem; margin: 0 0 8px; }
    p { color: var(--muted); margin: 0; line-height: 1.5; }
  </style>
</head>
<body>
  <main>
    <h1>All in one</h1>
    <p>Pagina iniziale. Sostituisci questo file con il contenuto reale del sito.</p>
  </main>
</body>
</html>
